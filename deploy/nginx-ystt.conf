# Dedicated-domain variant. Use this after ystt.d9v.uk points to the server and
# a certificate exists. Set YSTG_PUBLIC_BASE_URL=https://ystt.d9v.uk.
upstream ystg_backend {
    server 127.0.0.1:8090;
    keepalive 64;
}

server {
    listen 80;
    server_name ystt.d9v.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ystt.d9v.uk;

    ssl_certificate /etc/letsencrypt/live/ystt.d9v.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ystt.d9v.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:YSTT_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;


    location /api/ {
        access_log off;
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ystt_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 64k;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        limit_req zone=ystt_api_req burst=40 nodelay;
        limit_conn ystt_api_conn 20;
    }

    location / {
        proxy_pass http://ystg_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 2m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
