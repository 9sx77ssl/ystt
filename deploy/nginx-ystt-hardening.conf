# Include from /etc/nginx/conf.d/ (http context).
# Cloudflare supplies CF-Connecting-IP; direct loopback falls back to remote_addr.
map $http_cf_connecting_ip $ystt_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

limit_req_zone  $ystt_client_ip zone=ystt_api_req:10m rate=20r/s;
limit_conn_zone $ystt_client_ip zone=ystt_api_conn:10m;
limit_req_status 429;
limit_conn_status 429;
